<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Drive → Thumbnail</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#071a31,#0b3154);color:#fff}.box{width:min(680px,100%);padding:34px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(14px)}h1{margin:0 0 8px;font-size:32px}p{margin:0 0 25px;color:rgba(255,255,255,.68)}label{display:block;margin-bottom:8px;font-size:13px;font-weight:bold}textarea{width:100%;height:105px;resize:none;padding:14px;border-radius:13px;border:1px solid rgba(255,255,255,.15);outline:none;background:rgba(0,0,0,.22);color:#fff;font:14px Consolas,monospace}textarea:focus{border-color:#54d7ff}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;cursor:pointer;font-weight:bold;font-size:14px}.convert{background:linear-gradient(135deg,#62ddff,#00a7ff);color:#062039}.result{display:none;margin-top:24px}.result.show{display:block}.output{padding:13px;border-radius:12px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.1);color:#c9f3ff;font:13px/1.5 Consolas,monospace;word-break:break-all}.copy{background:rgba(255,255,255,.13);color:#fff}.message{min-height:20px;margin-top:10px;color:#ffb5b5;font-size:13px}.note{margin-top:20px;font-size:12px;color:rgba(255,255,255,.5);line-height:1.5}</style></head><body><div class="box"><h1>Drive → Thumbnail</h1><p>Dán link ảnh Google Drive và chuyển thành link thumbnail dùng cho website.</p><label for="driveLink">LINK GOOGLE DRIVE</label><textarea id="driveLink" placeholder="https://drive.google.com/file/d/FILE_ID/view?usp=sharing"></textarea><button class="convert" onclick="convertLink()">ĐỔI LINK</button><div class="message" id="message"></div><div class="result" id="result"><label>LINK THUMBNAIL</label><div class="output" id="output"></div><button class="copy" onclick="copyLink()">COPY LINK</button></div><div class="note">Công cụ chỉ lấy File ID từ link Drive và tạo thumbnail với kích thước w1920. Không lưu hoặc gửi link của bạn đi đâu.</div></div><script>function getFileId(link){link=link.trim();let match=link.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);if(match)return match[1];match=link.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(match)return match[1];if(/^[a-zA-Z0-9_-]{10,}$/.test(link))return link;return null}function convertLink(){const input=document.getElementById('driveLink').value,message=document.getElementById('message'),result=document.getElementById('result'),output=document.getElementById('output');message.textContent='';result.classList.remove('show');const id=getFileId(input);if(!id){message.textContent='Không nhận diện được link Google Drive. Hãy kiểm tra lại link.';return}output.textContent='https://drive.google.com/thumbnail?id='+id+'&sz=w1920';result.classList.add('show')}async function copyLink(){const text=document.getElementById('output').textContent,button=document.querySelector('.copy');try{await navigator.clipboard.writeText(text)}catch(e){const temp=document.createElement('textarea');temp.value=text;document.body.appendChild(temp);temp.select();document.execCommand('copy');temp.remove()}button.textContent='ĐÃ COPY ✓';setTimeout(()=>button.textContent='COPY LINK',1500)}document.getElementById('driveLink').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')convertLink()});</script></body></html>
